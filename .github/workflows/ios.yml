name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "development (iPhone propio) o app-store (TestFlight/App Store)"
        required: true
        default: development
        type: choice
        options:
          - development
          - app-store

jobs:
  build-ios:
    name: Compilar IPA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 y plantillas iOS
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7.2
          curl -L --fail -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          chmod +x "Godot.app/Contents/MacOS/Godot"

          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          curl -L --fail -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl
          unzip -q templates.tpz -d /tmp/tpl
          cp -R /tmp/tpl/templates/. "$TPL_DIR/"

      - name: Escribir Team ID en el preset iOS
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            /usr/bin/sed -i '' -E \
              "s#application/app_store_team_id=\"[^\"]*\"#application/app_store_team_id=\"${APPLE_TEAM_ID}\"#" \
              export_presets.cfg
            echo "Team ID aplicado: ${APPLE_TEAM_ID}"
          else
            echo "::warning::APPLE_TEAM_ID no definido; se mantiene el valor del preset (placeholder)."
          fi
          grep -n "app_store_team_id" export_presets.cfg

      - name: Importar recursos del proyecto
        run: |
          set -euo pipefail
          ./Godot.app/Contents/MacOS/Godot --headless --path . --import || true
          ls -d .godot/imported >/dev/null && echo "Cache .godot/imported listo"

      - name: Exportar proyecto Xcode con Godot
        run: |
          set -euo pipefail
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "iOS" "build/ios/los-magicos.ipa"
          ls -la build/ios | head -20

      - name: Instalar certificado y provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS="$(uuidgen)"

          echo -n "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Compilar, archivar y exportar el .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          METODO: ${{ inputs.export_method }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Perfil: $PROFILE_NAME"

          if [ "$METODO" = "app-store" ]; then
            IDENTIDAD="Apple Distribution"
          else
            IDENTIDAD="Apple Development"
          fi

          xcodebuild -project build/ios/los-magicos.xcodeproj \
            -scheme los-magicos -configuration Release -sdk iphoneos \
            -archivePath build/ios/los-magicos.xcarchive archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTIDAD" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METODO}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.losmagicos.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/los-magicos.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Guardar el .ipa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: los-magicos-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
